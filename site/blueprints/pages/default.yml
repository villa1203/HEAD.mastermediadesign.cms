title: Page par default

status:
  draft:
    label: Brouillon
    text: Accessible seulement depuis le panel
  listed:
    label: En ligne
    text: Publié sur le site

columns:
  - width: 1/2
    sections:
      subpages:
        type: pages
        headline: Sous-pages
        template: default
      meta_tags:
        type: fields
        fields:
          tags:
            label: Tags
            type: pages
            query: site.find('tags').children
            multiple: true
            layout: list
  - width: 1/1
    fields:
      content:
        label: Contenu
        type: blocks
        fieldsets:
          - videoautoplay
          - listeliens
          - cta
          - video
          - image
          - iframe
          - contenu
          - toggle


