name: Liste de liens
icon: list-bullet
preview: fields
wysiwyg: true


fields:
  theme:
    label: Thème
    type: select
    options:
      lumineux: Lumineux
      sombre: Sombre
      colore1: Coloré variante 1
      colore2: Coloré variante 2
    default: lumineux

  with_padding:
    label: Avec padding
    type: toggle
    help: Ajouter un padding sur les coté droite et gauche du block, pour qu'il y est de l'espace avec le bord de la fenêtre
    default: false

  oneColl:
    label: Sur une colonne
    type: toggle
    help: Mettre ce block sur une seule colonne pour les écrans larges
    default: false

  titre:
    label: Titre
    type: text

  description:
    label: Description
    type: writer

  liens:
    label: Liens
    type: structure
    fields:
      cover:
        label: Image cover
        type: files
        uploads: true
        max: 1
        accept:
          - image/*
      titre:
        label: Titre
        type: text
      lien:
        type: url
      description:
        label: Description
        type: writer
      tags:
        label: Tags
        type: pages
        query: site.find('tags').children
        multiple: true
        layout: list

  ctaurl:
    label: URL du CTA
    type: url

  ctatitre:
    label: Titre du bouton
    type: text
