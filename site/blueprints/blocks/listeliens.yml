name: Liste de liens
icon: list-bullet

fields:
  theme:
    label: Thème
    type: select
    options:
      lumineux: Lumineux
      sombre: Sombre
      colore1: Coloré variante 1
      colore2: Coloré variante 2
    default: lumineux

  titre:
    label: Titre
    type: text

  description:
    label: Description
    type: writer

  liens:
    label: Liens
    type: structure
    fields:
      cover:
        label: Image cover
        type: files
        uploads: true
        max: 1
        accept:
          - image/*
      titre:
        label: Titre
        type: text
      description:
        label: Description
        type: writer
      tags:
        label: Tags
        type: tags

  ctaurl:
    label: URL du CTA
    type: url

  ctatitre:
    label: Titre du bouton
    type: text
