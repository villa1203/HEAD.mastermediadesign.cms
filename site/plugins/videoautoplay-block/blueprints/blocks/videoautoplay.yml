name: Video Autoplay
icon: video

fields:
  theme:
    label: Theme
    type: select
    options:
      lumineux: Lumineux
      sombre: Sombre
      colore1: Colore variante 1
      colore2: Colore variante 2
    default: lumineux

  titre:
    label: Titre
    type: text
    preview: true

  description:
    label: Description
    type: writer

  fichier:
    label: Fichier MP4
    type: files
    uploads: true
    max: 1
    layout: cardlets
    image:
      cover: true
    accept:
      - video/mp4
    preview: true

  videodescription:
    label: Description video
    type: writer
    nodes: false
    marks: false

  ctaurl:
    label: URL du CTA
    type: url

  ctatitre:
    label: Titre du bouton
    type: text
